name: shieldwise

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shieldwise
      POSTGRES_PASSWORD: shieldwise_dev_password
      POSTGRES_DB: shieldwise
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shieldwise']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shieldwise
      MINIO_ROOT_PASSWORD: shieldwise_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://shieldwise:shieldwise_dev_password@postgres:5432/shieldwise?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: shieldwise
      S3_SECRET_ACCESS_KEY: shieldwise_dev_password
      S3_BUCKET: shieldwise-evidence
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: AES256
      AI_URL: http://ai:8000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai:
    build:
      context: ../../apps/ai
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - '8000:8000'

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
