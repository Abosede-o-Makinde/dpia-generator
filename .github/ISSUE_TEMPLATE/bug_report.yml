name: Bug report
description: Report a defect in the Shieldwise platform
labels: ['bug', 'triage']
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations: { required: true }
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - apps/api
        - apps/web
        - apps/ai
        - infra (Docker Compose / hosting)
        - Other/unsure
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations: { required: false }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Self-hosted Docker Compose / Kubernetes / local dev, OS, browser (if web)
    validations: { required: false }
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
    validations: { required: false }
